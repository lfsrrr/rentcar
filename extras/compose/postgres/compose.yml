# Aufruf:   docker compose up
#           docker compose exec db bash
#             ls
#             id
#           docker compose down

services:
  db:
    # https://github.com/docker-library/postgres/blob/master/18/trixie/Dockerfile
    image: postgres:18.1-trixie
    ports:
      - published: 5432
        target: 5432
    # https://dev.to/danvixent/how-to-setup-postgresql-with-ssl-inside-a-docker-container-5f3
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certificate.crt
      -c ssl_key_file=/var/lib/postgresql/key.pem
    volumes:
      - type: bind
        source: /Users/louis/Zimmermann/volumes/postgres/data
        target: /var/lib/postgresql/18/docker

      - type: bind
        source: /Users/louis/Zimmermann/volumes/postgres/tablespace
        target: /var/lib/postgresql/tablespace

      # Zertifikate direkt aus dem Projekt (src/main/resources) einbinden
      # Pfad geht 3 Ebenen hoch: extras/compose/postgres -> root -> src/main/resources
      - type: bind
        source: ../../../src/main/resources/private-key.pem
        target: /var/lib/postgresql/key.pem
        read_only: true
      - type: bind
        source: ../../../src/main/resources/certificate.crt
        target: /var/lib/postgresql/certificate.crt
        read_only: true

      - type: bind
        source: /Users/louis/Zimmermann/volumes/postgres/run
        target: /var/run/postgresql

      # SQL-Skripte (Schema/DB anlegen) liegen meist im Projekt unter extras/compose/postgres/sql
      # Falls du sie auch in den externen Ordner kopiert hast, lasse den Pfad so.
      # Falls sie im Projekt liegen, nutze: source: ./sql
      - type: bind
        source: /Users/louis/Zimmermann/volumes/postgres/sql
        target: /sql
        read_only: true

    environment:
      TZ: Europe/Berlin
      POSTGRES_PASSWORD: p
      POSTGRES_HOST_AUTH_METHOD: trust
    networks: [acme-network]
    user: "postgres:postgres"
    hostname: postgres
    container_name: postgres
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, pg_isready, --dbname=postgres, --username=postgres]
      interval: 5s
      timeout: 2s
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "1.0"
          memory: 512M

  # ------------------------------------------------------------------------------------
  # p g a d m i n
  # ------------------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.11.0
    ports:
      - published: 8888
        target: 80
    volumes:
      - type: bind
        source: /Users/louis/Zimmermann/volumes/postgres/pgadmin
        target: /var/lib/pgadmin
      - type: bind
        source: /Users/louis/Zimmermann/volumes/postgres/pgadmin4
        target: /var/lib/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@acme.com
      PGADMIN_DEFAULT_PASSWORD: p
      PGADMIN_DISABLE_POSTFIX: true
      GUNICORN_ACCESS_LOGFILE: /var/lib/pgadmin/pgadmin.log
    networks: [acme-network]
    user: "pgadmin:5050"
    hostname: pgadmin
    container_name: pgadmin
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, NET_BIND_SERVICE]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G

networks:
  acme-network:
    name: acme-network
